<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>韓國館 線上點餐</title>
<link rel="stylesheet" href="/css/main.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="app" class="order-app">

  <div class="hero" id="hero">
    <button class="history-pill" id="historyBtn" aria-label="Order history">🧾</button>
    <button class="lang-pill" id="currencyPillBtn"><span id="currencyPillLabel">NT$</span></button>
    <button class="lang-pill" id="langPillBtn"><span id="langPillLabel">Language</span></button>
  </div>

  <div class="store-header">
    <div class="store-avatar"><img src="/images/taegeuk.png" data-taegeuk-seasonal alt="" /></div>
    <div class="store-header-text">
      <h1 id="storeName">韓國館</h1>
      <div class="table-badge" id="tableBadge">桌號 --</div>
    </div>
    <button class="store-info-btn" id="storeInfoBtn" data-i18n="storeInfo">店家資訊</button>
    <!-- 회원(VIP) — optional Google sign-in entry point. Hidden until
         initMembership() in order.js confirms the store has a working
         firebaseConfig (Admin > 설정 > 회원(VIP) 로그인); a store that hasn't
         set this up yet shows no trace of the feature. -->
    <button class="store-info-btn" id="memberBtn" hidden>회원</button>
  </div>

  <div class="notice-banner" id="noticeBanner" hidden></div>

  <div class="cat-tabs-row">
    <nav class="cat-tabs" id="catTabs"></nav>
    <button class="icon-btn" id="searchBtn" aria-label="Search">&#128269;</button>
  </div>
  <div class="search-bar" id="searchBar" hidden>
    <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="搜尋餐點" />
  </div>

  <main class="menu-list" id="menuList">
    <div class="loading" data-i18n="loadingMenu">Loading menu…</div>
  </main>

  <div class="toast-banner" id="toastBanner"></div>

  <!-- Shown once, 1 minute before the 3-minute inactivity auto-lock. "연장"
       resets the timer back to a fresh 3 minutes; "확인" just dismisses this
       banner and lets the existing countdown keep running toward the lock.
       Any other normal interaction with the page (browsing the menu, etc.)
       still resets the countdown as always — this banner doesn't change
       that, it just also gives an explicit way to extend right here. -->
  <div class="idle-warning-banner" id="idleWarningBanner" hidden>
    <p id="idleWarningText"></p>
    <div class="idle-warning-actions">
      <button id="idleExtendBtn" data-i18n="idleExtendBtn">연장</button>
      <button id="idleAckBtn" data-idle-ignore data-i18n="idleAckBtn">확인</button>
    </div>
  </div>

  <button class="cart-fab" id="cartFab" hidden>
    <span id="cartCount">0</span>
    <span class="cart-fab-label" data-i18n="viewCart">查看購物車</span>
    <span id="cartTotal">$0</span>
  </button>

  <!-- Item detail sheet -->
  <div class="sheet-backdrop" id="itemSheetBackdrop" hidden>
    <div class="sheet" id="itemSheet">
      <button class="sheet-close" id="itemSheetClose">✕</button>
      <div class="sheet-photo" id="itemPhoto"></div>
      <div class="sheet-body">
        <h2 id="itemName"></h2>
        <p class="sheet-sub" id="itemSubNames"></p>
        <p class="sheet-desc" id="itemDesc"></p>
        <div class="item-allergens" id="itemAllergens" hidden></div>
        <div class="sheet-price-info" id="itemPriceInfo" hidden></div>
        <!-- 매장(dine-in) vs 포장(takeout) — chosen per dish (not once for the
             whole order), since one order can now mix dine-in and takeout
             items (e.g. eating here but taking dessert home). Always resets
             to 매장 every time this sheet opens for a fresh item — see
             openItemSheet() in order.js. -->
        <div class="order-type-tabs" id="itemOrderTypeTabs">
          <button type="button" class="order-type-tab active" data-type="dine_in" data-i18n="orderTypeDineIn">內用</button>
          <button type="button" class="order-type-tab" data-type="takeout" data-i18n="orderTypeTakeout">外帶</button>
        </div>
        <div class="options" id="itemOptions" hidden>
          <div class="options-label" data-i18n="chooseOption">請選擇</div>
          <div class="options-list" id="optionsList"></div>
        </div>
        <div class="options" id="itemSpiceOptions" hidden>
          <div class="options-label" data-i18n="chooseSpiceOption">請選擇辣度</div>
          <div class="options-list" id="spiceOptionsList"></div>
        </div>
        <!-- Multi-select extras (사리면 추가, 밥→당면 교체 등) — checkboxes, not
             radios, since more than one can be picked at once. See
             parseAddons()/openItemSheet() in order.js. -->
        <div class="options" id="itemAddons" hidden>
          <div class="options-label" data-i18n="chooseAddons">加點</div>
          <div class="options-list" id="addonsList"></div>
        </div>
        <div class="qty-row" id="qtyRow">
          <button id="qtyMinus">−</button>
          <span id="qtyVal">1</span>
          <button id="qtyPlus">+</button>
        </div>
        <div class="mix-options" id="mixOptions" hidden>
          <!-- Quick-pick: choosing 牛 sets it to 2/0, choosing 豬 sets it to
               0/2 — a normal single-choice starting point. The +/- counters
               below still let the customer fine-tune into an actual mix
               (e.g. 1/1) from there. See openItemSheet()/renderMixQuickPick()
               in order.js. -->
          <div class="options-label" data-i18n="chooseOption">請選擇</div>
          <div class="options-list" id="mixQuickPickList"></div>
          <div class="mix-options-list" id="mixOptionsList"></div>
          <div class="mix-options-hint" id="mixOptionsHint"></div>
        </div>
      </div>
      <button class="add-btn" id="addToCartBtn">
        <span data-i18n="addToCart">加入購物車</span>
        <span id="addToCartPrice"></span>
      </button>
    </div>
  </div>

  <!-- Cart drawer -->
  <div class="sheet-backdrop" id="cartBackdrop" hidden>
    <div class="sheet cart-sheet">
      <button class="sheet-close" id="cartClose">✕</button>
      <h2 data-i18n="yourOrder">您的訂單</h2>
      <div id="cartItems" class="cart-items"></div>
      <!-- Shown only when signed in with an active VIP card (see
           renderCartTotals() in order.js) — the discount itself is always
           computed and enforced server-side at submit time; this is just a
           preview so it isn't a surprise at checkout. -->
      <div class="cart-vip-row" id="cartVipDiscountRow" hidden>
        <span id="cartVipDiscountLabel"></span>
      </div>
      <div class="cart-total-row">
        <span data-i18n="total">總計</span>
        <span id="cartTotalBig">$0</span>
      </div>
      <button class="submit-btn" id="submitOrderBtn" data-i18n="placeOrder">送出訂單</button>
    </div>
  </div>

  <!-- Order confirmation -->
  <div class="sheet-backdrop" id="confirmBackdrop" hidden>
    <div class="sheet confirm-sheet">
      <div class="confirm-icon">✓</div>
      <h2 data-i18n="orderPlaced">訂單已送出！</h2>
      <p data-i18n="orderPlacedDesc">餐點正在準備中，請稍候</p>
      <div class="order-status-track" id="orderStatusTrack"></div>
      <button class="submit-btn" id="backToMenuBtn" data-i18n="orderMore">繼續加點</button>
    </div>
  </div>

  <!-- Order history (this table's running, unpaid total) -->
  <div class="sheet-backdrop" id="historyBackdrop" hidden>
    <div class="sheet history-sheet">
      <button class="sheet-close" id="historyClose">✕</button>
      <h2 data-i18n="myOrders">我的訂單</h2>
      <p class="history-table-label" id="historyTableLabel"></p>
      <div id="historyList" class="history-list"></div>
      <div class="history-total-row">
        <span data-i18n="total">總計</span>
        <span id="historyTotalBig">$0</span>
      </div>
      <button class="submit-btn" id="payOnlineBtn" data-i18n="payOnlineBtn" hidden>線上付款</button>
    </div>
  </div>

  <!-- Membership (회원/VIP) — optional Google sign-in to register an
       already-issued physical VIP card and get its discount applied
       automatically at checkout. Ordering never requires this. See
       initMembership()/renderMemberSheet() in order.js. Only reachable via
       #memberBtn, which stays hidden until Firebase is actually configured
       (Admin > 설정 > 회원(VIP) 로그인). -->
  <div class="sheet-backdrop" id="memberBackdrop" hidden>
    <div class="sheet member-sheet">
      <button class="sheet-close" id="memberClose">✕</button>
      <h2 data-i18n="memberTitle">회원(VIP)</h2>

      <div id="memberSignedOut">
        <p class="member-hint" data-i18n="memberSignedOutHint">구글로 로그인하면 보유한 VIP 카드를 등록해서 자동 할인을 받을 수 있어요.</p>
        <button class="google-signin-btn" id="googleSignInBtn">
          <span data-i18n="googleSignInBtn">구글로 로그인</span>
        </button>
        <p class="member-msg" id="memberSignInMsg" hidden></p>
      </div>

      <div id="memberSignedIn" hidden>
        <p class="member-account-line" id="memberAccountLine"></p>

        <div id="memberNoCard">
          <p class="member-hint" data-i18n="memberNoCardHint">보유한 실물 VIP 카드번호를 입력해서 등록하세요.</p>
          <input type="text" id="memberCardInput" data-i18n-placeholder="memberCardPlaceholder" placeholder="카드번호" maxlength="30" />
          <button class="add-btn" id="memberRegisterBtn" data-i18n="memberRegisterBtn">카드 등록</button>
          <p class="member-msg" id="memberRegisterMsg" hidden></p>
        </div>

        <div id="memberHasCard" hidden>
          <div class="member-card-badge" id="memberCardBadge"></div>
          <div class="member-card-info" id="memberCardInfo"></div>
        </div>

        <button class="member-signout-btn" id="memberSignOutBtn" data-i18n="memberSignOutBtn">로그아웃</button>
      </div>
    </div>
  </div>

  <!-- Store info sheet -->
  <div class="sheet-backdrop" id="storeInfoBackdrop" hidden>
    <div class="sheet">
      <button class="sheet-close" id="storeInfoClose">✕</button>
      <h2 id="storeInfoName" data-i18n="storeInfo">店家資訊</h2>
      <div class="info-rows">
        <div class="info-row"><span class="info-label" data-i18n="hoursLabel">營業時間</span><span id="infoHours"></span></div>
        <div class="info-row"><span class="info-label" data-i18n="phoneLabel">電話</span><span id="infoPhone"></span></div>
        <div class="info-row"><span class="info-label" data-i18n="addressLabel">地址</span><span id="infoAddress"></span></div>
        <div class="info-row"><span class="info-label" data-i18n="minSpendLabel">每人低消</span><span id="infoMinSpend"></span></div>
      </div>
    </div>
  </div>

  <!-- Party-size reminder (shown at submit time when the cart has fewer
       items than the registered headcount) — must be closed with the button
       itself, doesn't auto-dismiss. See showPartyWarningModal() /
       submitOrderFlow() in order.js. -->
  <div class="sheet-backdrop lock-backdrop" id="partyWarningBackdrop" hidden>
    <div class="lock-card">
      <div class="lock-icon">🍽️</div>
      <p id="partyWarningMsg" style="font-size:16px;line-height:1.5;margin:8px 0 16px;"></p>
      <button class="add-btn" id="partyWarningConfirmBtn" data-i18n="partyWarningConfirmBtn">확인</button>
    </div>
  </div>

  <!-- Party size (asked once per fresh page load, before ordering) -->
  <div class="sheet-backdrop lock-backdrop" id="partySizeBackdrop" hidden>
    <div class="lock-card">
      <div class="lock-icon">🍽️</div>
      <h2 data-i18n="partySizeTitle">몇 분이세요?</h2>
      <div class="qty-row" style="justify-content:center;margin:16px 0;">
        <button id="partySizeMinus">−</button>
        <span id="partySizeVal">1</span>
        <button id="partySizePlus">+</button>
      </div>
      <button class="add-btn" id="partySizeConfirmBtn" data-i18n="partySizeConfirm">확인</button>
    </div>
  </div>

  <!-- Counter/takeout pickup name (asked once per fresh page load instead of
       the party-size prompt above, only when this QR is the 포장 카운터 — see
       initPartySize()'s is_counter branch in order.js). Required so staff
       have something to call out at pickup, alongside the auto-assigned
       pickup number shown on the kitchen ticket / admin queue. -->
  <div class="sheet-backdrop lock-backdrop" id="counterNameBackdrop" hidden>
    <div class="lock-card">
      <div class="lock-icon">📦</div>
      <h2 data-i18n="counterNameTitle">성함을 알려주세요</h2>
      <p data-i18n="counterNameHint" style="color:var(--muted, #888);font-size:14px;margin-top:-8px;">포장 준비가 완료되면 성함으로 불러드려요</p>
      <input type="text" id="counterNameInput" data-i18n-placeholder="counterNamePlaceholder" placeholder="예: 홍길동" maxlength="20" style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:16px;margin:14px 0 8px;" />
      <input type="tel" id="counterPhoneInput" data-i18n-placeholder="counterPhonePlaceholder" placeholder="예: 0912345678" maxlength="20" style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:16px;margin:0 0 14px;" />
      <button class="add-btn" id="counterNameConfirmBtn" data-i18n="counterNameConfirm">확인</button>
    </div>
  </div>

  <!-- Session lock (shown after 3 minutes of inactivity — must re-scan the
       table's QR code to continue; there is no way to dismiss this except
       reloading the page, which is exactly the point). -->
  <div class="sheet-backdrop lock-backdrop" id="sessionLockBackdrop" hidden>
    <div class="lock-card">
      <div class="lock-icon">🔒</div>
      <h2 data-i18n="sessionLockTitle"></h2>
      <p data-i18n="sessionLockDesc"></p>
    </div>
  </div>

  <!-- Language sheet -->
  <div class="sheet-backdrop" id="langBackdrop" hidden>
    <div class="sheet lang-sheet">
      <button class="sheet-close" id="langSheetClose">✕</button>
      <h2 data-i18n="chooseLanguage">選擇語言</h2>
      <div class="lang-options">
        <button data-lang="zh" class="lang-option">中文</button>
        <button data-lang="ko" class="lang-option">한국어</button>
        <button data-lang="en" class="lang-option">English</button>
      </div>
    </div>
  </div>

  <!-- Currency sheet -->
  <div class="sheet-backdrop" id="currencyBackdrop" hidden>
    <div class="sheet lang-sheet">
      <button class="sheet-close" id="currencySheetClose">✕</button>
      <h2 data-i18n="chooseCurrency">選擇幣別</h2>
      <div class="lang-options">
        <button data-currency="TWD" class="lang-option">NT$ 台幣</button>
        <button data-currency="KRW" class="lang-option">₩ 원화</button>
        <button data-currency="USD" class="lang-option">US$ 美金</button>
      </div>
    </div>
  </div>

</div>

<!-- Firebase Authentication only (see src/firebaseAdmin.js) — all real data
     (VIP cards, orders, etc.) stays in the existing MongoDB. Used to be two
     unconditional <script> tags here, loaded from Google's CDN on every
     single customer page view even for a store that hasn't set up
     firebaseConfig yet (initMembership() would just no-op). 사장님 피드백:
     "터치 후 반응 속도랑 링크 타고 들어가는 속도가... 느려" — loadFirebaseSdk()
     in order.js now injects these two scripts lazily, only once a store has
     an actual firebaseConfig, so a store not using 회원(VIP) login (the
     common case right now) skips this download entirely. -->
<script src="/js/i18n.js"></script>
<script src="/js/allergens.js"></script>
<script src="/js/season.js"></script>
<script src="/js/order.js"></script>
</body>
</html>
