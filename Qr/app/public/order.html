<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>韓國館 線上點餐</title>
<link rel="stylesheet" href="/css/main.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
<div id="app" class="order-app">

  <div class="hero" id="hero">
    <button class="history-pill" id="historyBtn" aria-label="Order history">🧾</button>
    <button class="lang-pill" id="currencyPillBtn"><span id="currencyPillLabel">NT$</span></button>
    <button class="lang-pill" id="langPillBtn"><span id="langPillLabel">Language</span></button>
  </div>

  <div class="store-header">
    <div class="store-avatar">☯</div>
    <div class="store-header-text">
      <h1 id="storeName">韓國館</h1>
      <div class="table-badge" id="tableBadge">桌號 --</div>
    </div>
    <button class="store-info-btn" id="storeInfoBtn" data-i18n="storeInfo">店家資訊</button>
  </div>

  <div class="notice-banner" id="noticeBanner" hidden></div>

  <div class="cat-tabs-row">
    <nav class="cat-tabs" id="catTabs"></nav>
    <button class="icon-btn" id="searchBtn" aria-label="Search">&#128269;</button>
  </div>
  <div class="search-bar" id="searchBar" hidden>
    <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="搜尋餐點" />
  </div>

  <main class="menu-list" id="menuList">
    <div class="loading" data-i18n="loadingMenu">Loading menu…</div>
  </main>

  <div class="toast-banner" id="toastBanner"></div>

  <button class="cart-fab" id="cartFab" hidden>
    <span id="cartCount">0</span>
    <span class="cart-fab-label" data-i18n="viewCart">查看購物車</span>
    <span id="cartTotal">$0</span>
  </button>

  <!-- Item detail sheet -->
  <div class="sheet-backdrop" id="itemSheetBackdrop" hidden>
    <div class="sheet" id="itemSheet">
      <button class="sheet-close" id="itemSheetClose">✕</button>
      <div class="sheet-photo" id="itemPhoto"></div>
      <div class="sheet-body">
        <h2 id="itemName"></h2>
        <p class="sheet-sub" id="itemSubNames"></p>
        <p class="sheet-desc" id="itemDesc"></p>
        <div class="options" id="itemOptions" hidden>
          <div class="options-label" data-i18n="chooseOption">請選擇</div>
          <div class="options-list" id="optionsList"></div>
        </div>
        <textarea id="itemNote" data-i18n-placeholder="itemNotePlaceholder" placeholder="特殊要求（例如：不要辣、不要蔥）" maxlength="200"></textarea>
        <div class="qty-row">
          <button id="qtyMinus">−</button>
          <span id="qtyVal">1</span>
          <button id="qtyPlus">+</button>
        </div>
      </div>
      <button class="add-btn" id="addToCartBtn">
        <span data-i18n="addToCart">加入購物車</span>
        <span id="addToCartPrice"></span>
      </button>
    </div>
  </div>

  <!-- Cart drawer -->
  <div class="sheet-backdrop" id="cartBackdrop" hidden>
    <div class="sheet cart-sheet">
      <button class="sheet-close" id="cartClose">✕</button>
      <h2 data-i18n="yourOrder">您的訂單</h2>
      <div id="cartItems" class="cart-items"></div>
      <textarea id="orderNote" data-i18n-placeholder="orderNotePlaceholder" placeholder="整單備註（選填）" maxlength="300"></textarea>
      <div class="cart-total-row">
        <span data-i18n="total">總計</span>
        <span id="cartTotalBig">$0</span>
      </div>
      <button class="submit-btn" id="submitOrderBtn" data-i18n="placeOrder">送出訂單</button>
    </div>
  </div>

  <!-- Order confirmation -->
  <div class="sheet-backdrop" id="confirmBackdrop" hidden>
    <div class="sheet confirm-sheet">
      <div class="confirm-icon">✓</div>
      <h2 data-i18n="orderPlaced">訂單已送出！</h2>
      <p data-i18n="orderPlacedDesc">餐點正在準備中，請稍候</p>
      <div class="order-status-track" id="orderStatusTrack"></div>
      <button class="submit-btn" id="backToMenuBtn" data-i18n="orderMore">繼續加點</button>
    </div>
  </div>

  <!-- Order history (this table's running, unpaid total) -->
  <div class="sheet-backdrop" id="historyBackdrop" hidden>
    <div class="sheet history-sheet">
      <button class="sheet-close" id="historyClose">✕</button>
      <h2 data-i18n="myOrders">我的訂單</h2>
      <p class="history-table-label" id="historyTableLabel"></p>
      <div id="historyList" class="history-list"></div>
      <div class="history-total-row">
        <span data-i18n="total">總計</span>
        <span id="historyTotalBig">$0</span>
      </div>
    </div>
  </div>

  <!-- Store info sheet -->
  <div class="sheet-backdrop" id="storeInfoBackdrop" hidden>
    <div class="sheet">
      <button class="sheet-close" id="storeInfoClose">✕</button>
      <h2 id="storeInfoName" data-i18n="storeInfo">店家資訊</h2>
      <div class="info-rows">
        <div class="info-row"><span class="info-label" data-i18n="hoursLabel">營業時間</span><span id="infoHours"></span></div>
        <div class="info-row"><span class="info-label" data-i18n="phoneLabel">電話</span><span id="infoPhone"></span></div>
        <div class="info-row"><span class="info-label" data-i18n="addressLabel">地址</span><span id="infoAddress"></span></div>
        <div class="info-row"><span class="info-label" data-i18n="minSpendLabel">每人低消</span><span id="infoMinSpend"></span></div>
      </div>
    </div>
  </div>

  <!-- Party size (asked once per fresh page load, before ordering) -->
  <div class="sheet-backdrop lock-backdrop" id="partySizeBackdrop" hidden>
    <div class="lock-card">
      <div class="lock-icon">🍽️</div>
      <h2 data-i18n="partySizeTitle">몇 분이세요?</h2>
      <div class="qty-row" style="justify-content:center;margin:16px 0;">
        <button id="partySizeMinus">−</button>
        <span id="partySizeVal">1</span>
        <button id="partySizePlus">+</button>
      </div>
      <button class="add-btn" id="partySizeConfirmBtn" data-i18n="partySizeConfirm">확인</button>
    </div>
  </div>

  <!-- Session lock (shown after 3 minutes of inactivity — must re-scan the
       table's QR code to continue; there is no way to dismiss this except
       reloading the page, which is exactly the point). -->
  <div class="sheet-backdrop lock-backdrop" id="sessionLockBackdrop" hidden>
    <div class="lock-card">
      <div class="lock-icon">🔒</div>
      <h2 data-i18n="sessionLockTitle"></h2>
      <p data-i18n="sessionLockDesc"></p>
    </div>
  </div>

  <!-- Language sheet -->
  <div class="sheet-backdrop" id="langBackdrop" hidden>
    <div class="sheet lang-sheet">
      <button class="sheet-close" id="langSheetClose">✕</button>
      <h2 data-i18n="chooseLanguage">選擇語言</h2>
      <div class="lang-options">
        <button data-lang="zh" class="lang-option">中文</button>
        <button data-lang="ko" class="lang-option">한국어</button>
        <button data-lang="en" class="lang-option">English</button>
      </div>
    </div>
  </div>

  <!-- Currency sheet -->
  <div class="sheet-backdrop" id="currencyBackdrop" hidden>
    <div class="sheet lang-sheet">
      <button class="sheet-close" id="currencySheetClose">✕</button>
      <h2 data-i18n="chooseCurrency">選擇幣別</h2>
      <div class="lang-options">
        <button data-currency="TWD" class="lang-option">NT$ 台幣</button>
        <button data-currency="KRW" class="lang-option">₩ 원화</button>
        <button data-currency="USD" class="lang-option">US$ 美金</button>
      </div>
    </div>
  </div>

</div>

<script src="/js/i18n.js"></script>
<script src="/js/order.js"></script>
</body>
</html>
